<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>活動報名系統</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 FontAwesome 圖示 -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background-color: #f3f4f6; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2); }
        .mask-overlay { position: absolute; inset: 0; background: rgba(255,255,255,0.85); backdrop-filter: blur(4px); z-index: 20; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; border-radius: 0.5rem; opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
        .mask-overlay.active { opacity: 1; pointer-events: auto; }
        .toast { position: fixed; bottom: 20px; right: 20px; transform: translateY(100px); opacity: 0; transition: all 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55); z-index: 100; }
        .toast.show { transform: translateY(0); opacity: 1; }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen text-gray-800 relative">

    <header class="bg-white shadow-sm sticky top-0 z-30">
        <div class="max-w-6xl mx-auto px-4 py-3 flex justify-between items-center">
            <h1 class="text-xl font-bold text-blue-600"><i class="fas fa-ticket-alt mr-2"></i>報名系統</h1>
            <button onclick="openAdminLogin()" class="text-gray-500 hover:text-blue-600 transition text-sm flex items-center">
                <i class="fas fa-cog mr-1"></i> 後台管理
            </button>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-8 relative">
        <div class="flex flex-col md:flex-row gap-8">
            
            <!-- 左側：狀態卡片 -->
            <div class="w-full md:w-5/12 space-y-6">
                <div class="glass-panel rounded-2xl shadow-lg p-6 relative overflow-hidden">
                    <h2 id="displayTitle" class="text-2xl font-bold mb-2">載入中...</h2>
                    <p id="displayDesc" class="text-gray-600 text-sm mb-6 whitespace-pre-wrap">請稍候...</p>
                    
                    <div class="bg-blue-50 rounded-xl p-5 border border-blue-100">
                        <div class="flex justify-between items-end mb-2">
                            <span class="text-sm text-blue-800 font-medium"><i class="fas fa-users mr-1"></i>報名進度</span>
                            <span class="text-2xl font-bold text-blue-600" id="progressText">連線中</span>
                        </div>
                        <div class="w-full bg-gray-200 rounded-full h-3 mb-2 overflow-hidden">
                            <div id="progressBar" class="bg-gray-400 h-3 rounded-full transition-all duration-1000 ease-out" style="width: 100%"></div>
                        </div>
                        <p id="timeStatusText" class="text-xs text-center font-medium mt-3 text-gray-500">正在與雲端資料庫同步...</p>
                    </div>
                </div>

                <!-- 最新報名名單 -->
                <div class="glass-panel rounded-2xl shadow-lg p-6">
                    <h3 class="text-md font-bold mb-4 text-gray-700 border-b pb-2 flex justify-between items-center">
                        <span><i class="fas fa-list-ul mr-2"></i>最新報名名單</span>
                        <span class="text-xs font-normal text-green-600 bg-green-100 px-2 py-0.5 rounded-full"><i class="fas fa-cloud mr-1"></i>即時同步</span>
                    </h3>
                    <div id="registrationList" class="space-y-3 max-h-60 overflow-y-auto no-scrollbar">
                        <div class="text-center text-gray-500 py-4 text-sm"><i class="fas fa-spinner fa-spin mr-2"></i>載入雲端資料中...</div>
                    </div>
                </div>
            </div>

            <!-- 右側：報名表單 -->
            <div class="w-full md:w-7/12">
                <div class="glass-panel rounded-2xl shadow-lg p-6 md:p-8 relative min-h-[400px]">
                    <div id="formMask" class="mask-overlay active">
                        <div id="maskIcon" class="text-5xl text-blue-500 mb-4"><i class="fas fa-spinner fa-spin"></i></div>
                        <h3 id="maskTitle" class="text-2xl font-bold text-gray-800 mb-2">連線至資料庫</h3>
                        <p id="maskDesc" class="text-gray-500">正在確認剩餘名額，請稍候...</p>
                    </div>

                    <h2 class="text-2xl font-bold mb-6 text-gray-800">填寫報名資料</h2>
                    <form id="registrationForm" onsubmit="handleFormSubmit(event)" class="space-y-5">
                        <div id="dynamicFormFields" class="space-y-5"></div>
                        <button type="submit" id="submitBtn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl shadow-md transition-colors flex justify-center items-center mt-6">
                            <span>確認報名</span>
                        </button>
                    </form>
                </div>
            </div>

        </div>
    </main>

    <!-- 隱藏後台介面 -->
    <div id="loginModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center opacity-0 pointer-events-none transition-opacity">
        <div class="bg-white rounded-2xl p-8 max-w-sm w-full mx-4 shadow-2xl transform scale-95 transition-transform" id="loginBox">
            <h3 class="text-xl font-bold mb-2 text-center text-gray-800"><i class="fas fa-lock mr-2 text-blue-500"></i>管理員登入</h3>
            <p class="text-sm text-gray-500 mb-6 text-center">請輸入後端設定之安全密碼</p>
            <input type="password" id="adminPasswordInput" class="w-full border-gray-300 rounded-lg p-3 mb-4 focus:ring-2 focus:ring-blue-500 bg-gray-50" placeholder="請輸入密碼">
            <div class="flex gap-3">
                <button onclick="closeAdminLogin()" class="w-1/2 py-2 text-gray-600 bg-gray-100 hover:bg-gray-200 rounded-lg transition">取消</button>
                <button id="loginBtn" onclick="verifyPassword()" class="w-1/2 py-2 text-white bg-blue-600 hover:bg-blue-700 rounded-lg transition font-medium">登入</button>
            </div>
        </div>
    </div>

    <div id="adminPanel" class="fixed inset-y-0 right-0 w-full md:w-[450px] bg-white shadow-2xl z-40 transform translate-x-full transition-transform duration-300 flex flex-col">
        <div class="p-5 border-b bg-gray-50 flex justify-between items-center">
            <h2 class="text-xl font-bold text-gray-800"><i class="fas fa-cogs mr-2 text-blue-600"></i>系統管理後台</h2>
            <button onclick="closeAdminPanel()" class="text-gray-400 hover:text-red-500 text-2xl p-2"><i class="fas fa-times"></i></button>
        </div>
        
        <div class="p-6 overflow-y-auto flex-1 space-y-8 bg-white no-scrollbar">
            <section>
                <h3 class="font-bold text-gray-700 mb-3 border-l-4 border-blue-500 pl-2">活動基本資訊</h3>
                <div class="space-y-3">
                    <div><label class="text-sm text-gray-600">活動標題</label><input type="text" id="setEventTitle" class="w-full border rounded p-2 mt-1 bg-gray-50"></div>
                    <div><label class="text-sm text-gray-600">活動說明</label><textarea id="setEventDesc" rows="3" class="w-full border rounded p-2 mt-1 bg-gray-50"></textarea></div>
                </div>
            </section>

            <section>
                <h3 class="font-bold text-gray-700 mb-3 border-l-4 border-blue-500 pl-2">報名限制設定</h3>
                <div class="space-y-3">
                    <div><label class="text-sm text-gray-600">報名人數上限</label><input type="number" id="setMaxCapacity" class="w-full border rounded p-2 mt-1 bg-gray-50" min="1"></div>
                    <div><label class="text-sm text-gray-600">開始報名時間</label><input type="datetime-local" id="setStartTime" class="w-full border rounded p-2 mt-1 bg-gray-50"></div>
                    <div><label class="text-sm text-gray-600">截止報名時間</label><input type="datetime-local" id="setEndTime" class="w-full border rounded p-2 mt-1 bg-gray-50"></div>
                </div>
            </section>

            <section>
                <h3 class="font-bold text-gray-700 mb-3 border-l-4 border-blue-500 pl-2">報名表單欄位</h3>
                <div id="adminFieldsList" class="space-y-2 mb-3"></div>
                <div class="bg-gray-100 p-3 rounded-lg border border-dashed border-gray-300">
                    <div class="flex gap-2 mb-2">
                        <input type="text" id="newFieldName" placeholder="欄位名稱 (如: 公司名稱)" class="w-1/2 p-1.5 border rounded text-sm">
                        <select id="newFieldType" class="w-1/2 p-1.5 border rounded text-sm bg-white">
                            <option value="text">單行文字</option><option value="email">Email</option><option value="tel">電話號碼</option><option value="textarea">多行備註</option>
                        </select>
                    </div>
                    <div class="flex justify-between items-center mt-2">
                        <label class="flex items-center text-sm text-gray-600"><input type="checkbox" id="newFieldRequired" class="mr-1" checked> 必填欄位</label>
                        <button onclick="adminAddField()" class="bg-blue-100 text-blue-700 px-3 py-1 rounded text-sm hover:bg-blue-200 transition">+ 新增欄位</button>
                    </div>
                </div>
            </section>
        </div>

        <div class="p-4 bg-gray-50 border-t flex justify-between">
            <button id="exportBtn" onclick="downloadCSV()" class="text-green-600 bg-green-100 hover:bg-green-200 px-4 py-2 rounded-lg font-medium transition text-sm flex items-center"><i class="fas fa-file-excel mr-1"></i>雲端匯出</button>
            <button onclick="saveAdminSettings()" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg font-medium transition shadow-md">儲存設定</button>
        </div>
    </div>

    <!-- 提示訊息 -->
    <div id="toast" class="toast bg-gray-800 text-white px-5 py-3 rounded-xl shadow-2xl flex items-center gap-3">
        <i id="toastIcon" class="fas fa-check-circle text-green-400"></i>
        <span id="toastMsg">訊息內容</span>
    </div>

    <script>
        // 🚨🚨🚨 請將這裡替換為您的 Google Apps Script 網頁應用程式網址 🚨🚨🚨
        const GAS_URL = 'https://script.google.com/macros/s/AKfycbzID7ATrZhMozNBtzrY2brthlkehAJVMgjyfTROZMGMMWebqxTkMad5o5CVtRyChR24/exec';

        // 本地設定僅保留「表單格式與活動資訊」，報名名單完全移除
        const DEFAULT_STATE = {
            eventTitle: '2026 科技論壇報名',
            eventDescription: '歡迎參加年度科技盛會！\n請填寫下方資料完成報名。',
            maxCapacity: 50,
            startTime: '', 
            endTime: '',
            fields: [
                { id: 'f_name', name: '真實姓名', type: 'text', required: true },
                { id: 'f_phone', name: '聯絡電話', type: 'tel', required: true },
                { id: 'f_email', name: '電子郵件', type: 'email', required: true }
            ]
        };

        let state = {};
        let isAdminAuthed = false;
        
        // 來自雲端的即時變數
        let liveRegCount = 0;
        let liveLatestRegs = [];

        window.onload = () => {
            loadState();
            renderStaticUI();
            fetchLiveData(); // 網頁開啟時，立刻向雲端請求即時資料
            
            document.getElementById('adminPasswordInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') verifyPassword();
            });
        };

        function loadState() {
            const saved = localStorage.getItem('regSystemState');
            if (saved) { state = JSON.parse(saved); } 
            else { state = JSON.parse(JSON.stringify(DEFAULT_STATE)); saveState(); }
        }
        function saveState() {
            localStorage.setItem('regSystemState', JSON.stringify(state));
        }

        // 渲染本地固定的 UI (標題、表單欄位)
        function renderStaticUI() {
            document.getElementById('displayTitle').innerText = state.eventTitle;
            document.getElementById('displayDesc').innerText = state.eventDescription;

            const formContainer = document.getElementById('dynamicFormFields');
            formContainer.innerHTML = '';
            state.fields.forEach(f => {
                let inputHtml = '';
                const baseClass = "w-full border-gray-300 rounded-lg shadow-sm p-3 focus:border-blue-500 focus:ring-1 focus:ring-blue-500 bg-gray-50 transition";
                if (f.type === 'textarea') {
                    inputHtml = `<textarea id="${f.id}" name="${f.name}" class="${baseClass}" rows="3" ${f.required?'required':''}></textarea>`;
                } else {
                    inputHtml = `<input type="${f.type}" id="${f.id}" name="${f.name}" class="${baseClass}" ${f.required?'required':''}>`;
                }
                formContainer.innerHTML += `
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">${f.name} ${f.required ? '<span class="text-red-500">*</span>':''}</label>
                        ${inputHtml}
                    </div>
                `;
            });
        }

        // 向 GAS 請求即時報名資料
        async function fetchLiveData() {
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'getLiveData' })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    liveRegCount = result.count;
                    liveLatestRegs = result.latest;
                    updateLiveUI();
                    checkFormStatus();
                } else {
                    throw new Error("無法取得雲端狀態");
                }
            } catch (error) {
                console.error(error);
                showToast('雲端資料同步失敗', 'error');
                document.getElementById('progressText').innerText = "連線失敗";
                document.getElementById('maskTitle').innerText = "系統連線異常";
                document.getElementById('maskDesc').innerText = "無法取得即時名額，請稍後重整網頁。";
            }
        }

        // 更新與雲端同步的 UI (進度條、名單)
        function updateLiveUI() {
            // 更新進度條
            document.getElementById('progressText').innerText = `${liveRegCount} / ${state.maxCapacity}`;
            let percent = (liveRegCount / state.maxCapacity) * 100;
            if(percent > 100) percent = 100;
            const bar = document.getElementById('progressBar');
            bar.style.width = `${percent}%`;
            bar.className = `h-3 rounded-full transition-all duration-1000 ease-out ${percent >= 100 ? 'bg-red-500' : (percent >= 80 ? 'bg-yellow-400' : 'bg-blue-500')}`;

            // 更新即時名單
            const listDiv = document.getElementById('registrationList');
            if (liveRegCount === 0 || liveLatestRegs.length === 0) {
                listDiv.innerHTML = '<div class="text-center text-gray-400 py-4 text-sm italic">尚無人報名</div>';
            } else {
                listDiv.innerHTML = '';
                const nameKey = state.fields.length > 0 ? state.fields[0].name : '';
                
                liveLatestRegs.forEach(reg => {
                    let displayName = (nameKey && reg[nameKey]) ? reg[nameKey].toString() : '匿名';
                    if (displayName.length >= 2) {
                        displayName = displayName.charAt(0) + '○' + (displayName.length > 2 ? displayName.slice(-1) : '');
                    }
                    const timeStr = reg['報名時間'] ? reg['報名時間'].substring(0, 10) : '近期報名';
                    
                    listDiv.innerHTML += `
                        <div class="flex items-center justify-between p-3 bg-gray-50 rounded-lg border border-gray-100 animate-fade-in">
                            <div class="flex items-center"><div class="w-8 h-8 rounded-full bg-blue-100 text-blue-600 flex items-center justify-center font-bold mr-3">${displayName.charAt(0)}</div><span class="font-medium text-gray-700">${displayName}</span></div>
                            <span class="text-xs text-gray-400">${timeStr}</span>
                        </div>
                    `;
                });
            }
        }

        function checkFormStatus() {
            const mask = document.getElementById('formMask');
            const maskIcon = document.getElementById('maskIcon');
            const maskTitle = document.getElementById('maskTitle');
            const maskDesc = document.getElementById('maskDesc');
            const timeTxt = document.getElementById('timeStatusText');
            
            const now = new Date().getTime();
            const start = state.startTime ? new Date(state.startTime).getTime() : 0;
            const end = state.endTime ? new Date(state.endTime).getTime() : Infinity;

            if (start && now < start) {
                mask.className = 'mask-overlay active bg-white/90';
                maskIcon.innerHTML = '<i class="fas fa-clock"></i>';
                maskIcon.className = 'text-5xl text-yellow-500 mb-4';
                maskTitle.innerText = '報名尚未開始';
                maskDesc.innerText = `開放時間：${new Date(state.startTime).toLocaleString()}`;
                timeTxt.innerText = `即將於 ${new Date(state.startTime).toLocaleString()} 開放`;
            } else if (end && now > end) {
                mask.className = 'mask-overlay active bg-white/90';
                maskIcon.innerHTML = '<i class="fas fa-calendar-times"></i>';
                maskIcon.className = 'text-5xl text-gray-500 mb-4';
                maskTitle.innerText = '報名已截止';
                maskDesc.innerText = '感謝您的關注，活動已結束報名。';
                timeTxt.innerText = '報名已結束';
            } else if (liveRegCount >= state.maxCapacity) {
                mask.className = 'mask-overlay active bg-white/90';
                maskIcon.innerHTML = '<i class="fas fa-user-slash"></i>';
                maskIcon.className = 'text-5xl text-red-500 mb-4';
                maskTitle.innerText = '名額已滿';
                maskDesc.innerText = '非常抱歉，本次活動報名已額滿。';
                timeTxt.innerText = '報名已額滿';
                document.getElementById('progressBar').classList.add('bg-red-500');
            } else {
                mask.className = 'mask-overlay';
                if(end !== Infinity) {
                    timeTxt.innerText = `截止時間：${new Date(state.endTime).toLocaleString()}`;
                } else {
                    timeTxt.innerText = '報名開放中';
                }
            }
        }

        async function handleFormSubmit(e) {
            e.preventDefault();
            
            if (liveRegCount >= state.maxCapacity) {
                showToast('報名失敗：名額已滿', 'error'); return;
            }

            const btn = document.getElementById('submitBtn');
            const originalBtnHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-2"></i> 寫入資料中...';
            btn.disabled = true;

            let formData = {};
            state.fields.forEach(f => {
                formData[f.name] = document.getElementById(f.id).value;
            });

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify(formData)
                });
                const result = await response.json();

                if (result.status === 'success') {
                    showToast('報名成功！', 'success');
                    document.getElementById('registrationForm').reset();
                    // 重新向後端抓取最新資料，更新畫面
                    fetchLiveData();
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                showToast('寫入失敗，請稍後再試。', 'error');
            } finally {
                btn.innerHTML = originalBtnHtml;
                btn.disabled = false;
            }
        }

        // ==================== 後台管理 ====================
        
        function openAdminLogin() {
            if (isAdminAuthed) { openAdminPanel(); } 
            else {
                document.getElementById('loginModal').classList.remove('opacity-0', 'pointer-events-none');
                document.getElementById('loginBox').classList.remove('scale-95');
                document.getElementById('adminPasswordInput').value = '';
                document.getElementById('adminPasswordInput').focus();
            }
        }

        function closeAdminLogin() {
            document.getElementById('loginModal').classList.add('opacity-0', 'pointer-events-none');
            document.getElementById('loginBox').classList.add('scale-95');
        }

        async function verifyPassword() {
            const input = document.getElementById('adminPasswordInput').value;
            if (!input) return;

            const btn = document.getElementById('loginBtn');
            const originalText = btn.innerText;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'verifyPassword', password: input })
                });
                const result = await response.json();

                if (result.status === 'success') {
                    isAdminAuthed = true;
                    closeAdminLogin();
                    openAdminPanel();
                    showToast('登入成功', 'success');
                    document.getElementById('adminPasswordInput').value = ''; 
                } else { showToast(result.message || '密碼錯誤', 'error'); }
            } catch (error) { showToast('驗證失敗', 'error'); } 
            finally { btn.innerText = originalText; btn.disabled = false; }
        }

        function openAdminPanel() {
            document.getElementById('adminPanel').classList.remove('translate-x-full');
            document.getElementById('setEventTitle').value = state.eventTitle;
            document.getElementById('setEventDesc').value = state.eventDescription;
            document.getElementById('setMaxCapacity').value = state.maxCapacity;
            document.getElementById('setStartTime').value = state.startTime;
            document.getElementById('setEndTime').value = state.endTime;
            renderAdminFields();
        }

        function closeAdminPanel() {
            document.getElementById('adminPanel').classList.add('translate-x-full');
        }

        function renderAdminFields() {
            const list = document.getElementById('adminFieldsList');
            list.innerHTML = '';
            state.fields.forEach((f, index) => {
                list.innerHTML += `
                    <div class="flex justify-between items-center bg-white p-2 border rounded shadow-sm text-sm">
                        <div><span class="font-bold text-gray-700">${f.name}</span><span class="text-xs text-gray-400 ml-2">[${f.type}] ${f.required?'必填':'選填'}</span></div>
                        <button onclick="adminRemoveField(${index})" class="text-red-500 hover:bg-red-50 p-1 rounded"><i class="fas fa-trash"></i></button>
                    </div>
                `;
            });
        }

        function adminAddField() {
            const name = document.getElementById('newFieldName').value.trim();
            const type = document.getElementById('newFieldType').value;
            const req = document.getElementById('newFieldRequired').checked;
            if (!name) { showToast('請輸入欄位名稱', 'error'); return; }
            state.fields.push({ id: 'f_' + Date.now(), name: name, type: type, required: req });
            document.getElementById('newFieldName').value = '';
            renderAdminFields();
        }

        function adminRemoveField(index) {
            if(confirm('確定要刪除此欄位嗎？')) { state.fields.splice(index, 1); renderAdminFields(); }
        }

        function saveAdminSettings() {
            state.eventTitle = document.getElementById('setEventTitle').value;
            state.eventDescription = document.getElementById('setEventDesc').value;
            state.maxCapacity = parseInt(document.getElementById('setMaxCapacity').value) || 50;
            state.startTime = document.getElementById('setStartTime').value;
            state.endTime = document.getElementById('setEndTime').value;
            
            saveState();
            renderStaticUI();
            updateLiveUI();
            checkFormStatus();
            closeAdminPanel();
            showToast('設定已儲存更新', 'success');
        }

        // 向雲端請求全部資料並匯出 CSV
        async function downloadCSV() {
            if (liveRegCount === 0) { showToast('目前沒有資料可匯出', 'error'); return; }
            
            const btn = document.getElementById('exportBtn');
            const oriHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin mr-1"></i>抓取雲端資料...';
            btn.disabled = true;

            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    body: JSON.stringify({ action: 'exportAll' })
                });
                const result = await response.json();

                if (result.status === 'success' && result.allData) {
                    let csvContent = "data:text/csv;charset=utf-8,\uFEFF"; 
                    
                    // 根據取得的第一筆資料建立標題，若無資料則使用本地的 fields
                    let headers = result.allData.length > 0 ? Object.keys(result.allData[0]) : ['報名時間', ...state.fields.map(f => f.name)];
                    csvContent += headers.join(",") + "\r\n";
                    
                    result.allData.forEach(row => {
                        let rowData = headers.map(h => {
                            let val = row[h] ? row[h].toString() : '';
                            val = val.replace(/"/g, '""'); 
                            return `"${val}"`;
                        });
                        csvContent += rowData.join(",") + "\r\n";
                    });
                    
                    const encodedUri = encodeURI(csvContent);
                    const link = document.createElement("a");
                    link.setAttribute("href", encodedUri);
                    link.setAttribute("download", "報名完整名單_雲端.csv");
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    showToast('匯出成功', 'success');
                } else { throw new Error(); }
            } catch (e) {
                showToast('下載失敗，請直接開啟 Google 試算表查看', 'error');
            } finally {
                btn.innerHTML = oriHtml;
                btn.disabled = false;
            }
        }

        function showToast(msg, type = 'info') {
            const toast = document.getElementById('toast');
            const icon = document.getElementById('toastIcon');
            document.getElementById('toastMsg').innerText = msg;
            
            if (type === 'success') { icon.className = 'fas fa-check-circle text-green-400'; } 
            else if (type === 'error') { icon.className = 'fas fa-exclamation-circle text-red-400'; }
            
            toast.classList.add('show');
            setTimeout(() => { toast.classList.remove('show'); }, 3000);
        }
    </script>
</body>
</html>
